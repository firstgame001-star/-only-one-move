<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Only One Move</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0e14;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
    }

    .coins {
      background: #181d28;
      padding: 9px 14px;
      border-radius: 18px;
      font-weight: 700;
    }

    .level {
      margin-top: 45px;
      text-align: center;
      color: #8d96a8;
      font-size: 14px;
      letter-spacing: 2px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin: 12px 0 8px;
    }

    .description {
      text-align: center;
      color: #9da6b7;
      line-height: 1.5;
    }

    .game {
      margin-top: 45px;
      background: #131823;
      border-radius: 26px;
      padding: 35px 15px;
      text-align: center;
    }

    .equation {
      font-size: 43px;
      font-weight: 800;
      letter-spacing: 5px;
      margin: 20px 0 35px;
    }

    .moves {
      color: #aab2c0;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .hint {
      flex: 1;
      background: #181d28;
      color: white;
    }

    .move {
      flex: 1;
      background: #6c5ce7;
      color: white;
    }

    .message {
      min-height: 35px;
      margin-top: 20px;
      font-weight: 700;
      text-align: center;
    }

    .success {
      color: #55e6a5;
    }

    .wrong {
      color: #ff7675;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">🧠 ONE MOVE</div>
    <div class="coins">🪙 <span id="coins">300</span></div>
  </div>

  <div class="level">
    УРОВЕНЬ 1
  </div>

  <h1>Исправь равенство</h1>

  <div class="description">
    У тебя есть только один ход.<br>
    Выбери правильное действие.
  </div>

  <div class="game">

    <div class="equation">
      6 + 4 = 4
    </div>

    <div class="moves">
      ⚡ Остался 1 ход
    </div>

  </div>

  <div class="buttons">

    <button class="hint" onclick="hint()">
      💡 Подсказка · 50 🪙
    </button>

    <button class="move" onclick="makeMove()">
      Сделать ход
    </button>

  </div>

  <div id="message" class="message"></div>

</div>

<script>

let coins = 300;
let completed = false;

function hint() {

  if (completed) return;

  const message = document.getElementById("message");

  if (coins < 50) {
    message.className = "message wrong";
    message.innerText = "Недостаточно монет";
    return;
  }

  coins -= 50;

  document.getElementById("coins").innerText = coins;

  message.className = "message";
  message.innerText =
    "💡 Подумай, какую часть цифры можно переместить.";
}

function makeMove() {

  if (completed) return;

  completed = true;

  coins += 30;

  document.getElementById("coins").innerText = coins;

  const message = document.getElementById("message");

  message.className = "message success";

  message.innerHTML =
    "✓ Уровень пройден!<br><br>+30 🪙";

}

</script>

</body>
</html>
